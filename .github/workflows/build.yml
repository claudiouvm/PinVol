name: Build

on:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Entorno
        run: |
          sw_vers
          xcodebuild -version
          swift --version

      - name: Compilar y empaquetar
        run: ./build.sh

      - name: Validar Info.plist, ícono y recursos del paquete
        run: |
          plutil -lint Info.plist
          iconutil --convert iconset Resources/AppIcon.icns --output "$RUNNER_TEMP/AppIcon.iconset"
          for f in AppIcon.icns MenuBarActiveTemplate.png MenuBarActiveTemplate@2x.png MenuBarIdleTemplate.png MenuBarIdleTemplate@2x.png; do
            test -f "build/PinVol.app/Contents/Resources/$f" || { echo "Falta $f en el paquete"; exit 1; }
          done
          codesign --verify --verbose build/PinVol.app

      - name: Empaquetar la app
        run: ditto -c -k --keepParent build/PinVol.app PinVol.zip

      - uses: actions/upload-artifact@v4
        with:
          name: PinVol-macOS
          path: PinVol.zip
          if-no-files-found: error
