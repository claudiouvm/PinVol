name: Release

# En cada PR compila y deja el .dmg como artefacto.
# En main, además, actualiza dist/PinVol.dmg en el repo y publica una release (v<versión de Info.plist>)
# si esa versión aún no existe, con las notas de RELEASE_NOTES.md (inglés y después español).
# La comprobación de actualizaciones de la app consulta esa release.

on:
  push:
    branches: [main]
    paths-ignore: ['dist/**', 'docs/**', '**/*.md', '.github/FUNDING.yml']
  pull_request:
    paths-ignore: ['dist/**', 'docs/**', '**/*.md', '.github/FUNDING.yml']
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  dmg:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Entorno
        run: |
          sw_vers
          swift --version

      # Cada texto de la interfaz (L("…")) debe tener su traducción en Resources/es.lproj/Localizable.strings.
      - name: Comprobar las traducciones
        run: python3 tools/check-strings.py

      # La variante de desarrollo (-DSNAPSHOT) tiene código propio que no entra en la compilación normal.
      - name: Compilar la variante de capturas
        run: swift build -c release -Xswiftc -DSNAPSHOT --scratch-path .build-snap

      - name: Compilar y empaquetar el .dmg
        run: tools/make-dmg.sh

      - name: Comprobar el paquete
        run: |
          plutil -lint Info.plist
          VER=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" Info.plist)
          head -1 RELEASE_NOTES.md | grep -qF "$VER" || { echo "RELEASE_NOTES.md debe empezar con el título de la versión $VER"; exit 1; }
          iconutil --convert iconset Resources/AppIcon.icns --output "$RUNNER_TEMP/AppIcon.iconset"
          for f in AppIcon.icns MenuBarActiveTemplate.png MenuBarActiveTemplate@2x.png MenuBarIdleTemplate.png MenuBarIdleTemplate@2x.png; do
            test -f "build/PinVol.app/Contents/Resources/$f" || { echo "Falta $f en el paquete"; exit 1; }
          done
          for f in en.lproj/InfoPlist.strings es.lproj/InfoPlist.strings es.lproj/Localizable.strings; do
            test -f "build/PinVol.app/Contents/Resources/$f" || { echo "Falta $f en el paquete"; exit 1; }
          done
          plutil -lint Resources/en.lproj/InfoPlist.strings Resources/es.lproj/InfoPlist.strings Resources/es.lproj/Localizable.strings
          codesign --verify --verbose build/PinVol.app
          test "$(lipo -archs build/PinVol.app/Contents/MacOS/PinVol)" = "arm64" || { echo "El binario debe ser solo arm64"; exit 1; }
          hdiutil verify dist/PinVol.dmg

      # El instalador de actualizaciones se prueba aquí, en un macOS de verdad: monta el .dmg recién generado y cambia una app
      # «instalada» más vieja por la que trae (ver tools/test-install.sh y Sources/PinVol/SelfTest.swift).
      - name: Probar la instalación de una actualización
        run: tools/test-install.sh

      - uses: actions/upload-artifact@v4
        with:
          name: PinVol-dmg
          path: dist/PinVol.dmg
          if-no-files-found: error

      # Aquí solo sirve para revisar el diseño (en inglés y en español): se usan apps que ya trae el runner. Las capturas
      # de la portada, con Spotify, IINA y TIDAL instaladas, salen del workflow «Screenshots».
      - name: Capturas de la ventana
        continue-on-error: true
        env:
          APPS: com.apple.Music,com.apple.Safari,com.apple.Notes,com.apple.Maps,com.apple.TextEdit
        run: ./snapshot.sh build/snapshots

      - uses: actions/upload-artifact@v4
        with:
          name: capturas
          path: build/snapshots
          if-no-files-found: ignore

      - name: Actualizar dist/PinVol.dmg en el repo
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/PinVol.dmg
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore: actualiza dist/PinVol.dmg [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Publicar release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" Info.plist)
          CHANNEL=$(/usr/libexec/PlistBuddy -c "Print :PinVolReleaseChannel" Info.plist 2>/dev/null || true)
          if gh release view "v$VER" >/dev/null 2>&1; then
            echo "La release v$VER ya existe"
          else
            gh release create "v$VER" dist/PinVol.dmg --title "PinVol ${CHANNEL:+$CHANNEL }$VER" --notes-file RELEASE_NOTES.md --target "$GITHUB_SHA"
          fi
