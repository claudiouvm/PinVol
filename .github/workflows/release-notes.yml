name: Release notes

# Manual. Copia RELEASE_NOTES.md a la release de la versión actual de Info.plist
# (por ejemplo, tras corregir las notas sin cambiar de versión).
# Con `tag` y `notes` (siempre juntos) reemplaza en cambio las notas de otra release, por ejemplo una antigua.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release a corregir, por ejemplo v1.7 (vacío = la versión de Info.plist)"
        required: false
        default: ""
      notes:
        description: "Notas nuevas completas, en Markdown (vacío = RELEASE_NOTES.md)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  notes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Actualizar las notas de la release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          NOTES: ${{ inputs.notes }}
        run: |
          if [ -n "$TAG" ] || [ -n "$NOTES" ]; then
            if [ -z "$TAG" ] || [ -z "$NOTES" ]; then
              echo "::error::tag y notes van juntos: sin uno de los dos no se sabe qué release ni qué texto usar"
              exit 1
            fi
            case "$TAG" in
              v[0-9]*) ;;
              *) echo "::error::tag debe ser una versión como v1.7"; exit 1 ;;
            esac
            printf '%s\n' "$NOTES" > "$RUNNER_TEMP/notes.md"
            gh release edit "$TAG" --notes-file "$RUNNER_TEMP/notes.md"
          else
            VER=$(python3 -c "import plistlib; print(plistlib.load(open('Info.plist', 'rb'))['CFBundleShortVersionString'])")
            gh release edit "v$VER" --notes-file RELEASE_NOTES.md
          fi
